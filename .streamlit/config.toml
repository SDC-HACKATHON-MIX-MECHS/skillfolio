# Streamlit settings for running behind Replit's preview / deployment proxy.
# The app has no sign-in and no forms that change anything, so relaxing CORS and XSRF protection is safe here.

[server]
headless = true
address = "0.0.0.0"
port = 8501
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false

[browser]
gatherUsageStats = false

# Colours from docs/DESIGN.md section 1.
[theme]
base = "light"
primaryColor = "#4338CA"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F5F7"
textColor = "#1F2328"

[client]
toolbarMode = "minimal"
