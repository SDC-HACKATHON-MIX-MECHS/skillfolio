# Streamlit settings for running behind Replit's preview / deployment proxy.
# The app has no sign-in and no forms that change anything, so relaxing CORS and XSRF protection is safe here.

[server]
headless = true
address = "0.0.0.0"
port = 8501
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false
maxUploadSize = 2

[browser]
gatherUsageStats = false

# SkillFolio mint-and-charcoal theme: LIGHT sage page, off-white cards, ink text, Inter. Tokens match app/ui.py.
# primaryColor is INK (not amber: amber fails as text), so Streamlit's own widgets (radio, checkbox, slider, selection) are
# dark, not blue; mint is added to fills by app/theme.css. Inter is loaded by app/ui.py (system-ui fallback offline).
[theme]
base = "light"
primaryColor = "#171A18"
backgroundColor = "#D9E0D6"
secondaryBackgroundColor = "#E2E8DE"
textColor = "#171A18"
font = "sans serif"
baseRadius = "16px"
borderColor = "#C9D2C5"

[theme.sidebar]
backgroundColor = "#E9EEE6"
secondaryBackgroundColor = "#E2E8DE"

[client]
toolbarMode = "minimal"
