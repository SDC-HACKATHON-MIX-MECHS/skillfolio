# Streamlit settings for running behind Replit's preview / deployment proxy.
# The app has no sign-in and no forms that change anything, so relaxing CORS and XSRF protection is safe here.

[server]
headless = true
address = "0.0.0.0"
port = 8501
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false
maxUploadSize = 2

[browser]
gatherUsageStats = false

# SkillFolio v4 theme: LIGHT, warm off-white, ink text, Inter. Tokens match app/ui.py and docs/DESIGN.md section 1.
# primaryColor is INK (not amber: amber fails as text), so Streamlit's own widgets (radio, checkbox, slider, selection) are
# dark, not blue; amber is added to fills by app/theme.css. Inter is loaded by app/ui.py (system-ui fallback offline).
[theme]
base = "light"
primaryColor = "#1B1A17"
backgroundColor = "#F7F5F0"
secondaryBackgroundColor = "#F1EEE6"
textColor = "#1B1A17"
font = "sans serif"
baseRadius = "8px"
borderColor = "#E7E2D8"

[theme.sidebar]
backgroundColor = "#FBFAF7"
secondaryBackgroundColor = "#F1EEE6"

[client]
toolbarMode = "minimal"
